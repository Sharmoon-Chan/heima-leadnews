# P1.2 probe config for the MAIN instance (port 51802). ASCII only.
# Loaded only because the JVM is started with
#   -Darticle.detail.probe.file=<this file>
# Without that flag DetailProbe is a no-op.
#
# Article ids are the *test* ids from leadnews_article_p1 (all 16 digits, above 2^53-1),
# except the 19-digit record created for C7.
events.file=D:/Code/Java/heima-leadnews/_optimization-artifacts/20261030-P1.2-rework/events/A-events.log

# C2: cold key whose rebuild is slower than the fixed 50 ms wait and faster than the 3000 ms lease
db.delay.9007199254741001=300

# C3-B: second executor that acquires a fresh lock while A is still inside its (expired) lease
db.delay.9007199254741003=1500

# C4: holder that will be killed while it still owns the lock
db.delay.9007199254741004=60000

# C6: same id is used by the holder (800 ms rebuild) and by the waiter that gets interrupted
db.delay.9007199254741005=800
wait.interrupt.9007199254741005=true

# C3-B: the second executor contends on the SAME article id as C3-A, so its delay must live in
# this (main) instance's config only. Without it B's critical section is ~5 ms and is over before
# A's finally runs, so the mis-release would not be observable.
db.delay.9007199254741002=1500

